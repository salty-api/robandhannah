<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving | Rob &amp; Hannah</title>
<meta name="description" content="Thanksgiving menu at Rob & Hannah's.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ece0;
    --ink: #2a2118;
    --muted: #8a7a68;
    --accent: #a8431f;
    --rule: #d9cdb9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  main {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    padding: 12vh 28px 10vh;
    text-align: center;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: clamp(56px, 14vw, 104px);
    line-height: .95;
    letter-spacing: -.02em;
    margin: 28px 0 22px;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 300; }
  .sub {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 18px;
    color: var(--muted);
  }
  .divider {
    width: 1px; height: 64px;
    background: var(--ink);
    margin: 56px auto 8px;
    opacity: .6;
  }
  section { margin-top: 64px; }
  h2 {
    font-size: 11px;
    letter-spacing: .38em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 30px;
    display: flex; align-items: center; gap: 18px;
  }
  h2::before, h2::after {
    content: ""; flex: 1; height: 1px; background: var(--rule);
  }
  .item { margin-bottom: 26px; }
  .item h3 {
    font-family: "Fraunces", serif;
    font-weight: 400;
    font-size: 30px;
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .item p {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  footer {
    margin-top: 96px;
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 300;
    font-size: 16px;
    color: var(--muted);
  }
  footer span {
    display: block;
    font-family: "Inter", sans-serif;
    font-style: normal;
    font-size: 11px;
    letter-spacing: .38em;
    text-transform: uppercase;
    margin-top: 14px;
    color: var(--ink);
    font-weight: 400;
  }
  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: rise .9s ease both; }
    main > *:nth-child(2) { animation-delay: .08s; }
    main > *:nth-child(3) { animation-delay: .16s; }
    main > *:nth-child(4) { animation-delay: .24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Rob &amp; Hannah &middot; Est. 2021</div>
    <h1>Thanks<em>giving</em></h1>
    <div class="sub">A menu for the evening</div>
  </header>

  <div class="divider"></div>

  <section>
    <h2>To Start</h2>
    <div class="item"><h3>Caviar</h3></div>
    <div class="item"><h3>Cheese</h3></div>
    <div class="item"><h3>Champagne</h3></div>
  </section>

  <section>
    <h2>The Main</h2>
    <div class="item"><h3>Brined Turkey</h3></div>
  </section>

  <section>
    <h2>For the Table</h2>
    <div class="item"><h3>Potatoes &amp; Sauce</h3></div>
    <div class="item"><h3>Stuffing</h3></div>
  </section>

  <section>
    <h2>To Finish</h2>
    <div class="item"><h3>Pecan Pie</h3></div>
  </section>

  <footer>
    Thank you for being here.
    <span>Rob &amp; Hannah</span>
  </footer>
</main>
</body>
</html>
